/* 渠道成本口径：
   - trad = 该走廊传统渠道（银行+线下网点）平均成本，来自世界银行分国别数据 ← 走廊特定
   - mobile = 移动钱包全球平均
   - dig  = 该走廊数字渠道最优 ← 走廊特定
   - p2p  = 交易所点对点，仅作参考（有对手方风险，不参与「最省」评比） */
const METHODS = [
  {k:"trad",    cost:(c)=>c.trad,                 color:"var(--bad)"},
  {k:"mobile",  cost:()=>DATA.benchmark.mobile,   color:"var(--warn)"},
  {k:"digital", cost:(c)=>c.dig,                  color:"var(--ok)"},
];
let LANG = (navigator.language||"en").toLowerCase().startsWith("zh") ? "zh" : "en";
let FREQ = 12; let PRESET = "CO";

const $=s=>document.querySelector(s);
const money=n=>"$"+n.toLocaleString(LANG==="zh"?"zh-CN":"en-US",{maximumFractionDigits:2,minimumFractionDigits:2});
const money0=n=>"$"+Math.round(n).toLocaleString(LANG==="zh"?"zh-CN":"en-US");

function country(){
  const c=DATA.corridors.find(x=>x.c===($("#to").value))||DATA.corridors.find(x=>x.c===PRESET);
  return c||DATA.corridors[0];
}
function compute(){
  const amt=Math.max(1, parseFloat($("#amt").value)||0);
  const c=country();
  const rows=METHODS.map(m=>({...m, pct:m.cost(c), per:amt*m.cost(c)/100, yr:amt*m.cost(c)/100*FREQ}));
  // P2P 作为额外对比项（仅作参考值）
  const p2pPct=1.5;
  rows.push({k:"p2p", cost:()=>p2pPct, color:"#a371f7", pct:p2pPct, per:amt*p2pPct/100, yr:amt*p2pPct/100*FREQ, ref:true});
  return {amt,c,rows};
}
function render(){
  const T=TXT[LANG], {amt,c,rows}=compute();
  $("#h1").innerHTML=T.h1(); $("#sub").innerHTML=T.sub;
  $("#l-amt").textContent=T.lblAmt; $("#l-to").textContent=T.lblTo; $("#l-freq").textContent=T.lblFreq;
  $("#langbtn").textContent = LANG==="zh"?"English":"中文";
  document.documentElement.lang = LANG==="zh"?"zh-CN":"en";
  $("#freq").innerHTML=[12,6,24,52].map(f=>`<span class="chip${f===FREQ?" on":""}" data-f="${f}" style="${f===FREQ?"border-color:var(--acc);color:var(--tx)":""}">${T.freq[f]} <b>${f}</b></span>`).join("");
  $("#freq").querySelectorAll(".chip").forEach(el=>el.onclick=()=>{FREQ=+el.dataset.f;render();});
  // 选择器
  $("#to").innerHTML=DATA.corridors.map(x=>`<option value="${x.c}"${x.c===c.c?" selected":""}>${x.n} (${x.cur})</option>`).join("");

  const trad=rows[0];
  $("#big-lbl").textContent=T.bigLbl;
  $("#big-amt").textContent=money0(trad.yr);
  $("#big-note").innerHTML=LANG==="zh"
    ? `按 <b>每次 ${money0(amt)}</b>、<b>${c.trad.toFixed(1)}%</b> 的${c.n}传统渠道平均成本计算。<br>这笔钱本来能到家。`
    : `Based on <b>${money0(amt)}</b> per transfer at <b>${c.trad.toFixed(1)}%</b>, the average cost for ${c.n}.<br>That money should have arrived.`;

  const best=Math.min(...rows.filter(r=>!r.ref).map(r=>r.yr));
  const max=Math.max(...rows.map(r=>r.yr));
  $("#meth").innerHTML=rows.map(r=>{
    const mk=T.mk[r.k];
    const isBest=!r.ref && r.yr===best;
    const w=Math.max(4,(r.yr/max)*100);
    return `<div class="m${isBest?" best":""}">
      <div class="nm"><b>${mk.n}${isBest?`<span class="badge">${T.best}</span>`:""}${r.ref?` <span class="badge" style="background:#241f3a;color:#a371f7;border-color:#3d3160">ref</span>`:""}</b>
      <span>${mk.s}</span>
      <div class="bar"><i style="width:${w}%;background:${r.color}"></i></div></div>
      <div class="cost"><div class="p" style="color:${r.color}">${r.pct.toFixed(1)}%</div>
      <div class="u">${money(r.per)} ${T.perMo} · ${money0(r.yr)} ${T.perYr}</div></div></div>`;
  }).join("");

  const cheapest=rows.filter(r=>!r.ref).reduce((a,b)=>a.yr<b.yr?a:b);
  const sav=trad.yr-cheapest.yr;
  $("#yr-h").textContent=T.yrH;
  $("#yrlines").innerHTML=[
    ...rows.filter(r=>!r.ref).map(r=>`<div class="yrline"><span>${T.mk[r.k].n} · ${r.pct.toFixed(1)}%</span><span style="color:${r.color}">${money0(r.yr)}</span></div>`),
    `<div class="yrline"><span>${LANG==="zh"?"改走最省渠道，一年省下":"Switching to the cheapest saves"}</span><span class="gap">${money0(sav)}</span></div>`
  ].join("");
  $("#n-h").textContent=T.nH;
  $("#n-list").innerHTML=T.notes.map(x=>`<li>${x}</li>`).join("");
  $("#cta-h").textContent=T.ctaH; $("#cta-p").innerHTML=T.ctaP; $("#cta-btn").textContent=T.ctaBtn;
  $("#cta-btn").href=REF;
  $("#shlbl").textContent = LANG==="zh" ? "生成分享图 · 发到群里" : "Create a share image";
  $("#disc").innerHTML=T.disc; $("#src").textContent=T.src;
}
$("#langbtn").onclick=()=>{LANG=LANG==="zh"?"en":"zh";render();};
$("#amt").oninput=render;
$("#to").onchange=render;

/* ═══ 分享成图 ═══
   WhatsApp / Telegram 群里一张图转发就是一次传播 —— 移民社群的主要传播形式。
   canvas 直接绘制（不走 SVG 光栅化，部分 WebView 会静默失败）。
   toDataURL 同步主路径 + toBlob 兜底（号码玄机踩过 toBlob 回调永不触发的坑）。 */
const T2 = {
  zh:{ lost:"每年被手续费吃掉", on:"按", tch:"传统渠道平均成本", brk:"换个渠道，能省下",
       foot:"免费算你自己的：", haul:"钱不该在回家路上变少",
       reg:"开户免费 · 转入后即可汇款 · 不开通付费服务",
       rows:["传统渠道","移动钱包","数字渠道最优"],
       save:"改走最省渠道，一年省下" },
  en:{ lost:"Lost to fees every year", on:"Based on", tch:"avg. traditional cost", brk:"Switching saves",
       foot:"Check your own numbers, free:", haul:"Money shouldn't shrink on the way home",
       reg:"Opening an account is free — no paid services involved",
       rows:["Traditional","Mobile wallet","Best digital"],
       save:"Switching to the cheapest saves" }
};

function drawShare(){
  const T=T2[LANG], {amt,c,rows}=compute();
  const trad=rows[0], dig=rows[2], mob=rows[1];
  const W=1080,H=1350, P=72;
  const cv=document.createElement("canvas");
  cv.width=W; cv.height=H;
  const x=cv.getContext("2d");
  const FF='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",Roboto,"Helvetica Neue",Arial,sans-serif';
  // 背景
  const bg=x.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,"#0d1117"); bg.addColorStop(1,"#101722");
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  // 顶饰
  const gd=x.createLinearGradient(0,0,W,0);
  gd.addColorStop(0,"#e3b341"); gd.addColorStop(1,"#0d1117");
  x.fillStyle=gd; x.fillRect(0,0,W,6);
  const F=(s,w)=>`${w||700} ${s}px ${FF}`;
  const M=n=>"$"+Math.round(n).toLocaleString("en-US");
  const M2=n=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

  x.textAlign="center";
  // 国旗式国家标记
  x.fillStyle="#8b949e"; x.font=F(30,600);
  x.fillText(LANG==="zh"?`汇款到 ${c.n}`:`Sending to ${c.en||c.n}`, W/2, 118);
  // 主数字
  x.fillStyle="#8b949e"; x.font=F(32,500);
  x.fillText(T.lost, W/2, 214);
  x.fillStyle="#f85149"; x.font=F(112,800);
  x.fillText(M(trad.yr), W/2, 330);
  x.fillStyle="#5b6672"; x.font=F(27,400);
  x.fillText(`${T.on} ${M(amt)} × ${trad.pct.toFixed(1)}% ${T.tch}`, W/2, 382);

  // 分隔
  x.strokeStyle="#232a33"; x.lineWidth=2;
  x.beginPath(); x.moveTo(P,440); x.lineTo(W-P,440); x.stroke();

  // 三条渠道
  const list=[[T.rows[0],trad,"#f85149"],[T.rows[1],mob,"#d29922"],[T.rows[2],dig,"#3fb950"]];
  let y=516;
  list.forEach((it,i)=>{
    const [nm,r,col]=it;
    x.textAlign="left";
    x.fillStyle="#e6edf3"; x.font=F(34,600);
    x.fillText(nm,P,y);
    x.textAlign="right";
    x.fillStyle=col; x.font=F(38,700);
    x.fillText(r.pct.toFixed(1)+"%", W-P-190, y);
    x.fillStyle="#8b949e"; x.font=F(28,400);
    x.fillText(M(r.yr)+"/yr", W-P, y);
    // 进度条
    const bw=W-P*2;
    x.fillStyle="#1c2129"; roundRect(x,P,y+18,bw,8,4); x.fill();
    x.fillStyle=col; roundRect(x,P,y+18,Math.max(10,bw*(r.yr/list[0][1].yr)),8,4); x.fill();
    y+=112;
  });

  // 节省卡
  const sav=trad.yr-dig.yr;
  y+=20;
  x.fillStyle="#121b14"; roundRect(x,P,y,W-P*2,132,16); x.fill();
  x.strokeStyle="#2d5a35"; x.lineWidth=2; roundRect(x,P,y,W-P*2,132,16); x.stroke();
  x.textAlign="left"; x.fillStyle="#8b949e"; x.font=F(28,500);
  x.fillText(T.save, P+30, y+52);
  x.textAlign="right"; x.fillStyle="#3fb950"; x.font=F(56,800);
  x.fillText(M(sav), W-P-30, y+58);
  x.textAlign="left"; x.fillStyle="#5b6672"; x.font=F(24,400);
  x.fillText(LANG==="zh"?"这笔钱本来能到家。":"That money should have arrived.", P+30, y+102);

  // 底部
  x.textAlign="center";
  x.fillStyle="#2a3139"; x.fillRect(P,H-258,W-P*2,2);
  x.fillStyle="#e3b341"; x.font=F(31,700);
  x.fillText(T.haul, W/2, H-198);
  x.fillStyle="#8b949e"; x.font=F(27,400);
  x.fillText(T.foot, W/2, H-146);
  x.fillStyle="#e6edf3"; x.font=F(36,800);
  x.fillText("remitcalc.pages.dev", W/2, H-92);
  // 开户入口：图里必须带上，否则传播链断在这里
  x.fillStyle="#8b949e"; x.font=F(23,400);
  x.fillText(T.reg, W/2, H-44);

  return cv;
}

/* 生成图片文件（用于系统分享面板） */
function shareFile(){
  return new Promise(res=>{
    const cv=drawShare();
    let done=false;
    const fin=v=>{ if(!done){ done=true; res(v); } };
    try{
      cv.toBlob(b=>{ fin(b? new File([b],`remitcost-${LANG}.png`,{type:"image/png"}) : null); },"image/png");
      setTimeout(()=>fin(null), 4000);   // toBlob 回调可能永不触发 → 超时兜底
    }catch(e){ fin(null); }
  });
}
function roundRect(x,px,py,w,h,r){
  x.beginPath();
  x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r);
  x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath();
}

async function showShare(){
  // 优先：系统分享面板（图 + 文案 → 直达 WhatsApp / Telegram）
  const nav=window.navigator;
  const active=!nav.userActivation||nav.userActivation.isActive!==false;
  if(nav.share&&active){
    const f=await shareFile();
    if(f){
      const {rows,amt,c}=compute();
      const txt = LANG==="zh"
        ? `汇款到${c.n}：每年被手续费吃掉 $${Math.round(rows[0].yr)}，最省渠道只要 $${Math.round(rows[2].yr)}。`
        : `Sending to ${c.en||c.n}: $${Math.round(rows[0].yr)}/yr in fees, vs $${Math.round(rows[2].yr)} via the cheapest channel.`;
      try{
        const p=nav.share({files:[f], text:txt+" remitcalc.pages.dev",
          title: LANG==="zh"?"汇款成本计算器":"Remittance Cost Calculator"});
        const r=await Promise.race([p.then(()=>"ok").catch(()=>"err"),
          new Promise(x=>setTimeout(()=>x("timeout"),10000))]);
        if(r==="ok") return;
      }catch(e){}
    }
  }
  // 兜底：弹层看图 / 下载（长按保存）
  let dataURL;
  try{ dataURL=drawShare().toDataURL("image/png"); }
  catch(e){ alert(LANG==="zh"?"出图失败，请重试":"Image failed, please retry"); return; }
  const img=$("#ovimg");
  img.src=dataURL;
  $("#ovtip").textContent = LANG==="zh"
    ? "长按图片保存，或点下方下载。发到 WhatsApp / Telegram 群里，让更多工友看清这笔账。"
    : "Long-press to save, or download below. Share it in your WhatsApp / Telegram group.";
  $("#ovdl").onclick=()=>{
    const a=document.createElement("a");
    a.href=dataURL; a.download=`remitcost-${LANG}-${Math.round(Date.now()/1000)}.png`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
  $("#ovclose").onclick=()=>$("#ov").classList.remove("on");
  $("#ov").classList.add("on");
}
$("#shareimg").onclick=showShare;
$("#ov").onclick=(e)=>{ if(e.target.id==="ov") $("#ov").classList.remove("on"); };

if(PRESET){$("#to").value=PRESET;}
render();
</script>
