"拉美与加勒比","trad":6.8,"dig":3.4,"cur":"ARS","rate":1517.5209},{"c":"MA","en":"Morocco","n":"摩洛哥","r":"中东北非","trad":6.0,"dig":2.8,"cur":"MAD","rate":9.685424}]};
const REF = "https://www.binance.com/join?ref=LBD1108";

const TXT = {
  zh: {
    h1: ()=>'你寄回家的钱，<em>路上少了多少？</em>',
    sub: "输入金额，看清每家渠道实际吃掉你多少钱。<br>这是你自己算得出来的账，不需要注册任何账号。",
    lblAmt: "汇款金额（美元）", lblTo: "汇往哪里", lblFreq: "每年汇款次数",
    freq: {12:"每月一次",6:"两月一次",24:"每月两次",52:"每周一次"},
    bigLbl: "每年被手续费吃掉的钱",
    bigNote: (n,avg,yrs)=>`按 <b>每次 ${n}</b>、<b>${avg}%</b> 的平均成本计算。<br>这笔钱本来能到家。`,
    mk: {
      trad: {n:"银行 / 线下汇款", s:"电汇 · 网点柜面 · 中间行扣费"},
      mobile:{n:"移动钱包", s:"运营商 / 电子钱包（全球均值）"},
      digital:{n:"数字渠道最优", s:"持牌线上汇款 · 实时到账"},
      p2p: {n:"交易所 P2P", s:"点对点转账 · 需自行承担对手方风险"}
    },
    best: "最省", perMo: "每笔", perYr: "每年",
    yrH: "一年下来这笔账",
    yrLines: (amt,fr,costs)=>costs.map(c=>[c.n, c.yr]),
    nH: "几点必须说清楚",
    notes: [
      "<b>为什么有的渠道贵 3 倍？</b>银行电汇要过 SWIFT 中间行，每一层都扣一次费；数字汇款的成本几乎只有外汇点差。",
      "<b>汇率里也藏着成本。</b>有些渠道写着「零手续费」，却在汇率上加了 2-3%。本页的成本已包含汇率加价。",
      "<b>交易所 P2P 更便宜，但有前提</b>：需要对方承接、自行承担对手方风险，且部分国家的 P2P 商家会因风控冻结账户。适合能自己判断风险的人。",
      "<b>不要只看手续费。</b>到账速度、是否可追溯、出问题找谁，都是成本的一部分。",

    ],
    ctaH: "想用更便宜的渠道？",

    ctaBtn: "注册交易所 · 免费 →",
    disc: "本页为成本信息工具，不构成投资建议，不保证任何渠道的实际费率。<br>加密资产存在价格波动与法规风险，请自行判断。",
    src: "成本基准：World Bank Remittance Prices Worldwide（按单笔 200 美元统计）· 汇率：open.er-api.com",
  },
  en: {
    h1: ()=>'How much of your money <em>never makes it home?</em>',
    sub: "Enter an amount and see what each channel really costs you.<br>Do the math yourself — no signup, no account.",
    lblAmt: "Amount (USD)", lblTo: "Sending to", lblFreq: "Transfers per year",
    freq: {12:"Monthly",6:"Every 2 mo",24:"Twice a month",52:"Weekly"},
    bigLbl: "Lost to fees every year",
    bigNote: (n,avg,yrs)=>`Based on <b>$${n}</b> per transfer at an average cost of <b>${avg}%</b>.<br>That money should have arrived.`,
    mk: {
      trad: {n:"Bank / branch", s:"Wire · counter service · intermediary fees"},
      mobile:{n:"Mobile wallet", s:"Telco / e-wallet (global avg)"},
      digital:{n:"Best digital", s:"Licensed online transfer · instant"},
      p2p: {n:"Exchange P2P", s:"Peer-to-peer · you bear counterparty risk"}
    },
    best: "Cheapest", perMo: "each", perYr: "per year",
    yrH: "The bill, over one year",
    yrLines: (amt,fr,costs)=>costs.map(c=>[c.n, c.yr]),
    nH: "Things worth being clear about",
    notes: [
      "<b>Why are some channels 3× more?</b> A bank wire hops through SWIFT intermediaries, and each one takes a cut. Digital transfers cost almost nothing but the FX spread.",
      "<b>The exchange rate hides cost too.</b> Some providers advertise \"zero fee\" while adding 2–3% to the rate. The costs here already include that markup.",
      "<b>Exchange P2P is usually cheaper, with conditions</b>: you need a counterparty, you carry the counterparty risk, and in some countries merchants face account freezes. Suited to people who can judge that risk themselves.",
      "<b>Price isn't everything.</b> Speed, traceability, and who you can call when something breaks are all part of the real cost.",
      "This tool is free and needs no signup. Figures use published average ranges; your provider's quote is the one that counts."
    ],
    ctaH: "Want to use a cheaper channel?",
    ctaP: "Digital and P2P transfers require an exchange account.<br>Opening one is free — no paid services involved.",
    ctaBtn: "Open a free account →",
    disc: "This page is a cost-information tool. It is not investment advice and does not guarantee any provider's rates.<br>Crypto assets carry price and regulatory risk. Judge for yourself.",
    src: "Cost benchmark: World Bank Remittance Prices Worldwide (based on $200 transfers) · FX: open.er-api.com",
  }
};

/* 渠道成本口径：
   - trad = 该走廊传统渠道（银行+线下网点）平均成本，来自世界银行分国别数据 ← 走廊特定
   - mobile = 移动钱包全球平均
   - dig  = 该走廊数字渠道最优 ← 走廊特定
   - p2p  = 交易所点对点，仅作参考（有对手方风险，不参与「最省」评比） */
const METHODS = [
  {k:"trad",    cost:(c)=>c.trad,                 color:"var(--bad)"},
  {k:"mobile",  cost:()=>DATA.benchmark.mobile,   color:"var(--warn)"},
  {k:"digital", cost:(c)=>c.dig,                  color:"var(--ok)"},
];
let LANG = (navigator.language||"en").toLowerCase().startsWith("zh") ? "zh" : "en";
let FREQ = 12; let PRESET = "EG";

const $=s=>document.querySelector(s);
const money=n=>"$"+n.toLocaleString(LANG==="zh"?"zh-CN":"en-US",{maximumFractionDigits:2,minimumFractionDigits:2});
const money0=n=>"$"+Math.round(n).toLocaleString(LANG==="zh"?"zh-CN":"en-US");

function country(){
  const c=DATA.corridors.find(x=>x.c===($("#to").value))||DATA.corridors.find(x=>x.c===PRESET);
  return c||DATA.corridors[0];
}
function compute(){
  const amt=Math.max(1, parseFloat($("#amt").value)||0);
  const c=country();
  const rows=METHODS.map(m=>({...m, pct:m.cost(c), per:amt*m.cost(c)/100, yr:amt*m.cost(c)/100*FREQ}));
  // P2P 作为额外对比项（仅作参考值）
  const p2pPct=1.5;
  rows.push({k:"p2p", cost:()=>p2pPct, color:"#a371f7", pct:p2pPct, per:amt*p2pPct/100, yr:amt*p2pPct/100*FREQ, ref:true});
  return {amt,c,rows};
}
function render(){
  const T=TXT[LANG], {amt,c,rows}=compute();
  $("#h1").innerHTML=T.h1(); $("#sub").innerHTML=T.sub;
  $("#l-amt").textContent=T.lblAmt; $("#l-to").textContent=T.lblTo; $("#l-freq").textContent=T.lblFreq;
  $("#langbtn").textContent = LANG==="zh"?"English":"中文";
  document.documentElement.lang = LANG==="zh"?"zh-CN":"en";
  $("#freq").innerHTML=[12,6,24,52].map(f=>`<span class="chip${f===FREQ?" on":""}" data-f="${f}" style="${f===FREQ?"border-color:var(--acc);color:var(--tx)":""}">${T.freq[f]} <b>${f}</b></span>`).join("");
  $("#freq").querySelectorAll(".chip").forEach(el=>el.onclick=()=>{FREQ=+el.dataset.f;render();});
  // 选择器
  $("#to").innerHTML=DATA.corridors.map(x=>`<option value="${x.c}"${x.c===c.c?" selected":""}>${x.n} (${x.cur})</option>`).join("");

  const trad=rows[0];
  $("#big-lbl").textContent=T.bigLbl;
  $("#big-amt").textContent=money0(trad.yr);
  $("#big-note").innerHTML=LANG==="zh"
    ? `按 <b>每次 ${money0(amt)}</b>、<b>${c.trad.toFixed(1)}%</b> 的${c.n}传统渠道平均成本计算。<br>这笔钱本来能到家。`
    : `Based on <b>${money0(amt)}</b> per transfer at <b>${c.trad.toFixed(1)}%</b>, the average cost for ${c.n}.<br>That money should have arrived.`;

  const best=Math.min(...rows.filter(r=>!r.ref).map(r=>r.yr));
  const max=Math.max(...rows.map(r=>r.yr));
  $("#meth").innerHTML=rows.map(r=>{
    const mk=T.mk[r.k];
    const isBest=!r.ref && r.yr===best;
    const w=Math.max(4,(r.yr/max)*100);
    return `<div class="m${isBest?" best":""}">
      <div class="nm"><b>${mk.n}${isBest?`<span class="badge">${T.best}</span>`:""}${r.ref?` <span class="badge" style="background:#241f3a;color:#a371f7;border-color:#3d3160">ref</span>`:""}</b>
      <span>${mk.s}</span>
      <div class="bar"><i style="width:${w}%;background:${r.color}"></i></div></div>
      <div class="cost"><div class="p" style="color:${r.color}">${r.pct.toFixed(1)}%</div>
      <div class="u">${money(r.per)} ${T.perMo} · ${money0(r.yr)} ${T.perYr}</div></div></div>`;
  }).join("");

  const cheapest=rows.filter(r=>!r.ref).reduce((a,b)=>a.yr<b.yr?a:b);
  const sav=trad.yr-cheapest.yr;
  $("#yr-h").textContent=T.yrH;
  $("#yrlines").innerHTML=[
    ...rows.filter(r=>!r.ref).map(r=>`<div class="yrline"><span>${T.mk[r.k].n} · ${r.pct.toFixed(1)}%</span><span style="color:${r.color}">${money0(r.yr)}</span></div>`),
    `<div class="yrline"><span>${LANG==="zh"?"改走最省渠道，一年省下":"Switching to the cheapest saves"}</span><span class="gap">${money0(sav)}</span></div>`
  ].join("");
  $("#n-h").textContent=T.nH;
  $("#n-list").innerHTML=T.notes.map(x=>`<li>${x}</li>`).join("");
  $("#cta-h").textContent=T.ctaH; $("#cta-p").innerHTML=T.ctaP; $("#cta-btn").textContent=T.ctaBtn;
  $("#cta-btn").href=REF;
  $("#disc").innerHTML=T.disc; $("#src").textContent=T.src;
}
$("#langbtn").onclick=()=>{LANG=LANG==="zh"?"en":"zh";render();};
$("#amt").oninput=render;
$("#to").onchange=render;
if(PRESET){$("#to").value=PRESET;}
render();
</script>
</body>
</html>
